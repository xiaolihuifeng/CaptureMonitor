[project]
name = "capture-monitor"
version = "1.0.0"
description = "Windows tray app that auto-captures screen frames when a reference image appears (template matching + perceptual-hash dedup)."
requires-python = ">=3.9"
dependencies = [
    "PyQt5>=5.15,<6",
    "opencv-python>=4.8",
    "numpy>=1.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
